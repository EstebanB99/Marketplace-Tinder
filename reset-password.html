<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f0">
    <title>Reset your password — Found</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #20231f;
            --muted: #777a72;
            --paper: #f5f4f0;
            --card: #fffefa;
            --line: #e8e6df;
            --green: #376b50;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(ellipse at 86% 12%, rgba(227, 233, 217, .55), transparent 34rem), var(--paper);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(440px, 100%);
            padding: 36px;
            border: 1px solid rgba(32, 35, 31, .07);
            border-radius: 20px;
            background: var(--card);
            box-shadow: 0 24px 70px rgba(43, 48, 37, .1);
        }
        h1 { margin: 0; font: 500 34px/1.1 Georgia, "Times New Roman", serif; letter-spacing: -1px; text-align: center; }
        p { color: var(--muted); font-size: 13px; line-height: 1.65; }
        label { display: block; margin: 18px 0 7px; color: #4d5049; font-size: 12px; font-weight: 700; }
        input {
            width: 100%;
            min-height: 45px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: white;
            color: var(--ink);
            font: inherit;
            font-size: 13px;
        }
        input:focus { border-color: var(--green); outline: 2px solid rgba(55, 107, 80, .16); }
        button {
            width: 100%;
            min-height: 46px;
            margin-top: 20px;
            border: 0;
            border-radius: 10px;
            background: var(--green);
            color: white;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
        }
        button:disabled { cursor: wait; opacity: .7; }
        #reset-message { min-height: 20px; margin: 13px 0 0; color: #a33d2b; text-align: center; }
        a { display: block; margin-top: 18px; color: var(--green); font-size: 13px; font-weight: 700; text-align: center; }
        [hidden] { display: none !important; }
        @media (max-width: 480px) { main { padding: 28px 22px; } }
    </style>
</head>
<body>
    <main>
        <h1>Choose a new password</h1>
        <p>Use at least 6 characters, including an uppercase letter, a lowercase letter, and a special character.</p>
        <form id="reset-form" hidden>
            <label for="password">New password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required>
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required>
            <button id="submit-button" type="submit">Reset password</button>
        </form>
        <p id="reset-message" role="status" aria-live="polite">Checking your reset link…</p>
        <a href="/auth.html">Back to sign in</a>
    </main>
    <script src="api.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
