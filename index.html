<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f0">
    <title>Found — Find your next favorite thing</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #20231f;
            --muted: #777a72;
            --paper: #f5f4f0;
            --card: #fffefa;
            --line: #e8e6df;
            --green: #376b50;
            --green-dark: #28523c;
            --orange: #e8845b;
            --shadow: 0 24px 70px rgba(43, 48, 37, .1);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 86% 12%, rgba(227, 233, 217, .55), transparent 34rem),
                var(--paper);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button { font: inherit; }

        .shell {
            width: min(1120px, calc(100% - 48px));
            margin: 0 auto;
        }

        header {
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(32, 35, 31, .09);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            color: var(--ink);
            font-size: 23px;
            font-weight: 750;
            letter-spacing: -1.2px;
            text-decoration: none;
        }

        .brand-mark {
            width: 31px;
            height: 31px;
            display: grid;
            place-items: center;
            border-radius: 10px 10px 10px 3px;
            background: var(--green);
            color: white;
            font-size: 18px;
            letter-spacing: 0;
        }

        .header-note {
            color: var(--muted);
            font-size: 13px;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-note { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .nav-link {
            padding: 0;
            border: 0;
            background: none;
            color: var(--green);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-link:hover { color: var(--green-dark); }

        main {
            min-height: calc(100vh - 89px);
            display: grid;
            grid-template-columns: minmax(0, 1fr) 270px;
            align-items: center;
            gap: 74px;
            padding: 48px 0 60px;
        }

        .intro { margin-bottom: 24px; }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--green);
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(32px, 4vw, 45px);
            font-weight: 500;
            letter-spacing: -1.8px;
            line-height: 1.1;
        }

        .subheading {
            margin: 11px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .item-card {
            overflow: hidden;
            width: 100%;
            max-width: 650px;
            border: 1px solid rgba(32, 35, 31, .07);
            border-radius: 22px;
            background: var(--card);
            box-shadow: var(--shadow);
            animation: arrive .35s ease both;
        }

        @keyframes arrive {
            from { opacity: .35; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .photo-wrap {
            position: relative;
            height: clamp(260px, 37vw, 390px);
            background: #e7e5df;
        }

        .photo-wrap img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .photo-label {
            position: absolute;
            top: 17px;
            left: 17px;
            padding: 8px 11px;
            border: 1px solid rgba(255,255,255,.55);
            border-radius: 99px;
            background: rgba(255, 254, 250, .91);
            color: #41443d;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .3px;
            backdrop-filter: blur(8px);
        }

        .card-content { padding: 23px 27px 25px; }

        .item-title-line {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
        }

        h2 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 27px;
            font-weight: 500;
            letter-spacing: -.5px;
        }

        .item-number {
            flex: none;
            color: #96978f;
            font-size: 11px;
            font-weight: 650;
            letter-spacing: .6px;
        }

        .description {
            margin: 9px 0 16px;
            color: #62655e;
            font-size: 14px;
            line-height: 1.55;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #54574f;
            font-size: 12px;
        }

        .location svg { flex: none; color: var(--green); }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 17px;
            margin-top: 21px;
        }

        .choice {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-width: 158px;
            min-height: 49px;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
        }

        .choice:hover { transform: translateY(-2px); }
        .choice:focus-visible, .reset:focus-visible { outline: 3px solid #d5a28a; outline-offset: 3px; }
        .choice:active { transform: translateY(0); }

        .discard {
            border: 1px solid var(--line);
            background: #fff;
            color: #52554f;
        }

        .discard:hover { box-shadow: 0 7px 18px rgba(30, 34, 28, .08); }

        .keep {
            background: var(--green);
            color: white;
        }

        .keep:hover {
            background: var(--green-dark);
            box-shadow: 0 7px 18px rgba(55, 107, 80, .2);
        }

        .choice-symbol { font-size: 18px; font-weight: 500; line-height: 1; }

        .keyboard-hint {
            margin: 13px 0 0;
            color: #999a92;
            font-size: 11px;
            text-align: center;
        }

        .sidebar { align-self: center; padding-top: 54px; }

        .progress-card {
            padding: 23px;
            border: 1px solid rgba(32, 35, 31, .07);
            border-radius: 18px;
            background: rgba(255, 254, 250, .74);
        }

        .progress-card h3 {
            margin: 0 0 19px;
            font-size: 13px;
            font-weight: 700;
        }

        .progress-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 9px;
            color: var(--muted);
            font-size: 11px;
        }

        .progress-track {
            height: 6px;
            overflow: hidden;
            border-radius: 20px;
            background: #e9e8e2;
        }

        .progress-fill {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: var(--green);
            transition: width .3s ease;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .stat {
            padding: 12px;
            border-radius: 12px;
            background: #f6f5f0;
        }

        .stat-number {
            display: block;
            margin-bottom: 4px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 24px;
        }

        .stat-label { color: var(--muted); font-size: 10px; }

        .tip {
            margin: 19px 2px 0;
            color: #797b74;
            font-size: 12px;
            line-height: 1.7;
        }

        .reset {
            margin: 13px 2px 0;
            padding: 5px 0;
            border: 0;
            background: none;
            color: var(--green);
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
        }

        .empty-state {
            max-width: 650px;
            padding: 70px 28px;
            border: 1px solid rgba(32, 35, 31, .07);
            border-radius: 22px;
            background: var(--card);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .empty-icon { margin-bottom: 13px; font-size: 36px; }
        .empty-state h2 { font-size: 30px; }
        .empty-state p { margin: 10px 0 21px; color: var(--muted); font-size: 14px; }
        .empty-state .choice { min-width: 145px; }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 800px) {
            main {
                grid-template-columns: minmax(0, 1fr);
                gap: 25px;
                padding-top: 38px;
            }
            .sidebar { padding-top: 0; }
            .progress-card { max-width: 650px; }
            .tip { margin-top: 13px; }
        }

        @media (max-width: 520px) {
            .shell { width: min(100% - 30px, 440px); }
            header { height: 70px; }
            .header-nav { gap: 9px; }
            .header-note { max-width: 92px; text-align: right; font-size: 10px; }
            .nav-link { font-size: 11px; }
            main { min-height: calc(100vh - 71px); padding: 30px 0 38px; }
            .intro { margin-bottom: 18px; }
            .subheading { font-size: 13px; }
            .item-card { border-radius: 17px; }
            .photo-wrap { height: 250px; }
            .card-content { padding: 20px 19px 21px; }
            h2 { font-size: 24px; }
            .item-number { font-size: 10px; }
            .card-footer { gap: 10px; }
            .choice { min-width: 0; width: 50%; min-height: 48px; }
            .progress-card { padding: 19px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header>
            <a class="brand" href="/" aria-label="Found home">
                <span class="brand-mark" aria-hidden="true">f</span>
                found
            </a>
            <nav class="header-nav" aria-label="Main navigation">
                <a class="nav-link" href="saved.html">Saved items</a>
                <span class="header-note" id="account-email"></span>
                <button class="nav-link" id="sign-out" type="button">Sign out</button>
            </nav>
        </header>

        <main>
            <section aria-labelledby="page-title">
                <div class="intro">
                    <p class="eyebrow">Your local marketplace</p>
                    <h1 id="page-title">A little treasure<br>hunt, just for you.</h1>
                    <p class="subheading">Keep what you love. Pass on what you don't.<br>Let's see what's out there.</p>
                </div>
                <div id="item-area" aria-live="polite"></div>
            </section>

            <aside class="sidebar" aria-label="Your review progress">
                <div class="progress-card">
                    <h3>Your finds, so far</h3>
                    <div class="progress-topline">
                        <span id="review-count">0 of 0 reviewed</span>
                        <span id="progress-percent">0%</span>
                    </div>
                    <div class="progress-track" role="progressbar" aria-label="Items reviewed" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" id="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="stats">
                        <div class="stat">
                            <span class="stat-number" id="kept-count">0</span>
                            <span class="stat-label">Kept</span>
                        </div>
                        <div class="stat">
                            <span class="stat-number" id="passed-count">0</span>
                            <span class="stat-label">Passed</span>
                        </div>
                    </div>
                </div>
                <p class="tip">A favorite could be just one swipe away. Use the buttons or your keyboard to decide.</p>
                <button class="reset" id="restore-passed" type="button" hidden>Show passed items again</button>
                <p class="tip" id="restore-status" role="status" hidden></p>
            </aside>
        </main>
    </div>
    <div class="sr-only" id="announcement" role="status"></div>

    <script src="api.js"></script>
    <script src="marketplace.js"></script>
</body>
</html>
