<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f0">
    <title>Sign in — Found</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #20231f;
            --muted: #777a72;
            --paper: #f5f4f0;
            --card: #fffefa;
            --line: #e8e6df;
            --green: #376b50;
            --green-dark: #28523c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 28px 16px;
            background:
                radial-gradient(ellipse at 86% 12%, rgba(227, 233, 217, .55), transparent 34rem),
                var(--paper);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .auth-shell { width: min(440px, 100%); }

        .brand {
            width: fit-content;
            display: flex;
            align-items: center;
            gap: 11px;
            margin: 0 auto 25px;
            color: var(--ink);
            font-size: 23px;
            font-weight: 750;
            letter-spacing: -1.2px;
            text-decoration: none;
        }

        .brand-mark {
            width: 31px;
            height: 31px;
            display: grid;
            place-items: center;
            border-radius: 10px 10px 10px 3px;
            background: var(--green);
            color: white;
            font-size: 18px;
            letter-spacing: 0;
        }

        .auth-card {
            padding: 34px;
            border: 1px solid rgba(32, 35, 31, .07);
            border-radius: 20px;
            background: var(--card);
            box-shadow: 0 24px 70px rgba(43, 48, 37, .1);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--green);
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 1.8px;
            text-align: center;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 34px;
            font-weight: 500;
            letter-spacing: -1px;
            text-align: center;
        }

        .subheading {
            margin: 9px 0 24px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-bottom: 22px;
            padding: 4px;
            border-radius: 10px;
            background: #f0efe9;
        }

        .tab {
            min-height: 39px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
        }

        .tab[aria-selected="true"] { background: white; color: var(--ink); box-shadow: 0 1px 3px rgba(32, 35, 31, .08); }

        label {
            display: block;
            margin: 0 0 7px;
            color: #4d5049;
            font-size: 12px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 45px;
            margin-bottom: 16px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: white;
            color: var(--ink);
            font: inherit;
            font-size: 13px;
        }

        input:focus { border-color: var(--green); outline: 2px solid rgba(55, 107, 80, .16); }

        .submit {
            width: 100%;
            min-height: 46px;
            margin-top: 3px;
            border: 0;
            border-radius: 10px;
            background: var(--green);
            color: white;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
        }

        .submit:hover { background: var(--green-dark); }
        .guest-button {
            width: 100%;
            min-height: 44px;
            margin-top: 11px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: white;
            color: var(--green-dark);
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
        }

        .guest-button:hover { background: #f8f7f3; }
        button:focus-visible, a:focus-visible { outline: 3px solid #d5a28a; outline-offset: 3px; }

        .message {
            min-height: 20px;
            margin: 13px 0 0;
            color: #a33d2b;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        .password-hint {
            margin: -9px 0 15px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.5;
        }

        .text-link {
            display: block;
            margin: -7px 0 15px auto;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--green);
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
        }

        @media (max-width: 480px) { .auth-card { padding: 28px 22px; } }
    </style>
</head>
<body>
    <main class="auth-shell">
        <a class="brand" href="/" aria-label="Found home">
            <span class="brand-mark" aria-hidden="true">f</span>
            found
        </a>
        <section class="auth-card" aria-labelledby="page-title">
            <p class="eyebrow">A marketplace for good finds</p>
            <h1 id="page-title">Welcome to Found.</h1>
            <p class="subheading" id="auth-description">Sign in to pick up where you left off, or create an account to start browsing.</p>
            <div class="tabs" id="account-tabs" role="tablist" aria-label="Account options">
                <button class="tab" id="login-tab" type="button" role="tab" aria-selected="true">Sign in</button>
                <button class="tab" id="register-tab" type="button" role="tab" aria-selected="false">Create account</button>
            </div>
            <form id="auth-form">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="320" required>
                <div id="password-field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" minlength="1" maxlength="128" required>
                    <p class="password-hint" id="password-hint" hidden>At least 6 characters, with an uppercase letter, a lowercase letter, and a special character.</p>
                </div>
                <button class="text-link" id="forgot-link" type="button">Forgot password?</button>
                <button class="text-link" id="back-to-login" type="button" hidden>Back to sign in</button>
                <button class="submit" id="submit-button" type="submit">Sign in</button>
                <p class="message" id="form-message" role="alert"></p>
            </form>
            <button class="guest-button" id="guest-button" type="button">Continue as guest</button>
        </section>
    </main>
    <script src="api.js"></script>
    <script src="auth.js"></script>
</body>
</html>
