<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f0">
    <title>Saved finds — Found</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #20231f;
            --muted: #777a72;
            --paper: #f5f4f0;
            --card: #fffefa;
            --line: #e8e6df;
            --green: #376b50;
            --green-dark: #28523c;
            --shadow: 0 18px 48px rgba(43, 48, 37, .08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 86% 12%, rgba(227, 233, 217, .55), transparent 34rem),
                var(--paper);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .shell { width: min(1120px, calc(100% - 48px)); margin: 0 auto; }

        header {
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(32, 35, 31, .09);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            color: var(--ink);
            font-size: 23px;
            font-weight: 750;
            letter-spacing: -1.2px;
            text-decoration: none;
        }

        .brand-mark {
            width: 31px;
            height: 31px;
            display: grid;
            place-items: center;
            border-radius: 10px 10px 10px 3px;
            background: var(--green);
            color: white;
            font-size: 18px;
            letter-spacing: 0;
        }

        nav { display: flex; align-items: center; gap: 20px; }

        .nav-link {
            padding: 0;
            border: 0;
            background: none;
            color: var(--green);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-link:hover { color: var(--green-dark); }
        .header-note { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        a:focus-visible, button:focus-visible { outline: 3px solid #d5a28a; outline-offset: 3px; }

        main { padding: 55px 0 70px; }

        .intro { margin-bottom: 30px; }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--green);
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(36px, 5vw, 48px);
            font-weight: 500;
            letter-spacing: -1.8px;
            line-height: 1.1;
        }

        .subheading { margin: 11px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        .saved-card {
            overflow: hidden;
            border: 1px solid rgba(32, 35, 31, .07);
            border-radius: 18px;
            background: var(--card);
            box-shadow: var(--shadow);
            animation: arrive .3s ease both;
        }

        @keyframes arrive {
            from { opacity: .4; transform: translateY(7px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .saved-card img {
            width: 100%;
            height: 215px;
            display: block;
            background: #e7e5df;
            object-fit: cover;
        }

        .card-content { padding: 18px 19px 19px; }
        .item-title-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

        h2 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 23px;
            font-weight: 500;
            letter-spacing: -.4px;
        }

        .item-number { flex: none; color: #96978f; font-size: 10px; font-weight: 650; letter-spacing: .5px; }
        .description { min-height: 63px; margin: 9px 0 14px; color: #62655e; font-size: 13px; line-height: 1.6; }

        .location {
            display: flex;
            align-items: flex-start;
            gap: 7px;
            margin-bottom: 16px;
            color: #54574f;
            font-size: 11px;
            line-height: 1.5;
        }

        .location svg { flex: none; color: var(--green); }

        .remove-button {
            width: 100%;
            min-height: 42px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: white;
            color: #52554f;
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            transition: background .16s ease, transform .16s ease;
        }

        .remove-button:hover { transform: translateY(-1px); background: #f8f7f3; }

        .empty-state {
            padding: 68px 24px;
            border: 1px solid rgba(32, 35, 31, .07);
            border-radius: 20px;
            background: var(--card);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .empty-icon { margin-bottom: 13px; font-size: 36px; }
        .empty-state h2 { font-size: 29px; }
        .empty-state p { margin: 10px 0 21px; color: var(--muted); font-size: 14px; }

        .browse-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 45px;
            padding: 0 18px;
            border-radius: 11px;
            background: var(--green);
            color: white;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .browse-button:hover { background: var(--green-dark); }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

        @media (max-width: 850px) {
            .item-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
            main { padding-top: 40px; }
        }

        @media (max-width: 560px) {
            .shell { width: min(100% - 30px, 440px); }
            header { height: 70px; }
            nav { gap: 8px; }
            .header-note { max-width: 76px; font-size: 10px; }
            .nav-link { font-size: 11px; }
            main { padding: 32px 0 45px; }
            .item-grid { grid-template-columns: 1fr; }
            .saved-card img { height: 235px; }
            .description { min-height: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header>
            <a class="brand" href="index.html" aria-label="Found home">
                <span class="brand-mark" aria-hidden="true">f</span>
                found
            </a>
            <nav aria-label="Main navigation">
                <a class="nav-link" href="index.html">Browse items</a>
                <span class="header-note" id="account-email"></span>
                <button class="nav-link" id="sign-out" type="button">Sign out</button>
            </nav>
        </header>

        <main>
            <div class="intro">
                <p class="eyebrow">Your collection</p>
                <h1>Things you love.</h1>
                <p class="subheading" id="saved-count">Your kept items, all in one place.</p>
            </div>
            <section id="saved-items" class="item-grid" aria-label="Your saved items" aria-live="polite"></section>
        </main>
    </div>
    <div class="sr-only" id="announcement" role="status"></div>
    <script src="api.js"></script>
    <script src="saved-page.js"></script>
</body>
</html>
