<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f0">
    <title>Shopping preferences — Found</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #20231f;
            --muted: #777a72;
            --paper: #f5f4f0;
            --card: #fffefa;
            --line: #e8e6df;
            --green: #376b50;
            --green-dark: #28523c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 28px 16px;
            background: radial-gradient(ellipse at 86% 12%, rgba(227, 233, 217, .55), transparent 34rem), var(--paper);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(560px, 100%);
            padding: 36px;
            border: 1px solid rgba(32, 35, 31, .07);
            border-radius: 20px;
            background: var(--card);
            box-shadow: 0 24px 70px rgba(43, 48, 37, .1);
        }
        .eyebrow {
            margin: 0 0 10px;
            color: var(--green);
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 1.8px;
            text-align: center;
            text-transform: uppercase;
        }
        h1 {
            margin: 0;
            font: 500 34px/1.1 Georgia, "Times New Roman", serif;
            letter-spacing: -1px;
            text-align: center;
        }
        .intro { margin: 10px 0 25px; color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; }
        fieldset { margin: 0; padding: 0; border: 0; }
        legend { margin-bottom: 12px; font-size: 13px; font-weight: 700; }
        .category-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .category-option {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            color: #4d5049;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .category-option:has(input:checked) { border-color: var(--green); background: #f1f5ef; color: var(--green-dark); }
        input[type="checkbox"] { width: 17px; height: 17px; margin: 0; accent-color: var(--green); }
        button {
            width: 100%;
            min-height: 46px;
            margin-top: 20px;
            border: 0;
            border-radius: 10px;
            background: var(--green);
            color: white;
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
        }
        button:hover { background: var(--green-dark); }
        button:disabled { cursor: wait; opacity: .7; }
        #preferences-message { min-height: 20px; margin: 12px 0 0; color: #a33d2b; font-size: 12px; line-height: 1.5; text-align: center; }
        @media (max-width: 480px) {
            main { padding: 28px 22px; }
            .category-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Welcome to Found</p>
        <h1>What do you love to shop for?</h1>
        <p class="intro">Choose the categories you’re interested in. We’ll save your preferences to your profile.</p>
        <form id="preferences-form">
            <fieldset>
                <legend>Select one or more categories</legend>
                <div class="category-list">
                    <label class="category-option"><input type="checkbox" name="category" value="Furniture">Furniture</label>
                    <label class="category-option"><input type="checkbox" name="category" value="Home decor">Home decor</label>
                    <label class="category-option"><input type="checkbox" name="category" value="Lighting">Lighting</label>
                    <label class="category-option"><input type="checkbox" name="category" value="Plants">Plants</label>
                    <label class="category-option"><input type="checkbox" name="category" value="Kitchen & dining">Kitchen &amp; dining</label>
                    <label class="category-option"><input type="checkbox" name="category" value="Storage">Storage</label>
                    <label class="category-option"><input type="checkbox" name="category" value="Outdoor">Outdoor</label>
                    <label class="category-option"><input type="checkbox" name="category" value="Other">Other</label>
                </div>
            </fieldset>
            <button id="save-preferences" type="submit">Save and continue</button>
            <p id="preferences-message" role="status" aria-live="polite"></p>
        </form>
    </main>
    <script src="api.js"></script>
    <script src="preferences.js"></script>
</body>
</html>
