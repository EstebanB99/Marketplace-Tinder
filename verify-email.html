<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f4f0">
    <title>Verify your email — Found</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #20231f;
            --muted: #777a72;
            --paper: #f5f4f0;
            --card: #fffefa;
            --green: #376b50;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(ellipse at 86% 12%, rgba(227, 233, 217, .55), transparent 34rem), var(--paper);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(440px, 100%);
            padding: 36px;
            border: 1px solid rgba(32, 35, 31, .07);
            border-radius: 20px;
            background: var(--card);
            box-shadow: 0 24px 70px rgba(43, 48, 37, .1);
            text-align: center;
        }
        h1 { margin: 0; font: 500 34px/1.1 Georgia, "Times New Roman", serif; letter-spacing: -1px; }
        p { color: var(--muted); font-size: 14px; line-height: 1.65; }
        #verification-status { min-height: 24px; }
        a { color: var(--green); font-weight: 700; }
        @media (max-width: 480px) { main { padding: 28px 22px; } }
    </style>
</head>
<body>
    <main>
        <h1>Confirming your email</h1>
        <p id="verification-status" role="status" aria-live="polite">Please wait while we verify your email address.</p>
        <a id="continue-link" href="/" hidden>Continue to Found</a>
    </main>
    <script src="api.js"></script>
    <script src="verify-email.js"></script>
</body>
</html>
